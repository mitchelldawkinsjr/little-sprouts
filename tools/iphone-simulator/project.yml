name: SproutsSafariSpeech
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
targets:
  SpeechHarness:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.littlesprouts.speech-check-host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  SafariSpeechUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: SpeechHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.littlesprouts.safari-speech-checks
        TEST_TARGET_NAME: SpeechHarness
schemes:
  SafariSpeech:
    build:
      targets:
        SpeechHarness: all
    test:
      targets: [SafariSpeechUITests]
