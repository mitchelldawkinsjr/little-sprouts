name: Publish Fire Tablet Update
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable release version (first production release: 1.0.0)'
        required: true
        type: string
      publish:
        description: 'Publish after verification (only from merged main)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: fire-production-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify release configuration
        env:
          KEYSTORE: ${{ secrets.FIRE_APK_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.FIRE_APK_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.FIRE_APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FIRE_APK_KEY_PASSWORD }}
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python3 tools/fire-tablet/version.py "$VERSION"
          if [[ "$PUBLISH" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Merge the release fixes before publishing from main'; exit 1
          fi
          missing=0
          for name in KEYSTORE PASSWORD ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "Missing signing configuration: $name"; missing=1; fi
          done
          if [[ "$missing" == 1 ]]; then
            echo 'Configure the four FIRE_APK_* repository secrets described in tools/fire-tablet/README.md'; exit 1
          fi
          echo 'All four signing credentials are configured (values withheld)'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Test updater policy
        run: |
          javac -d "$RUNNER_TEMP/updater-tests" tools/fire-tablet/UpdatePolicy.java tools/fire-tablet/UpdatePolicyTest.java
          java -cp "$RUNNER_TEMP/updater-tests" org.littlesprouts.learning.UpdatePolicyTest
          python3 -m unittest discover -s tools/fire-tablet -p 'test_*.py'
      - name: Stage app and locked Capacitor tooling
        run: |
          python3 tools/fire-tablet/stage.py
          cp tools/fire-tablet/package.json tools/fire-tablet/package-lock.json .fire-build/
          cd .fire-build
          npm ci --no-audit --no-fund
          npx --no-install cap add android
          npx --no-install cap sync android
      - name: Install updater and set version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 tools/fire-tablet/install-updater.py
          python3 tools/fire-tablet/version.py "$VERSION" .fire-build/android/app/build.gradle
      - name: Match launcher icon to PWA
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 tools/fire-tablet/install-icon.py
      - name: Build release APK
        working-directory: .fire-build/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign and verify production APK
        env:
          KEYSTORE: ${{ secrets.FIRE_APK_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.FIRE_APK_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.FIRE_APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FIRE_APK_KEY_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: bash tools/fire-tablet/sign-apk.sh
      - name: Verify continuity and optionally publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          mode=verify
          if [[ "$PUBLISH" == true ]]; then mode=publish; fi
          python3 tools/fire-tablet/release.py "$VERSION" "$mode"
      - name: Retain verified APK and certificate report
        uses: actions/upload-artifact@v4
        with:
          name: little-sprouts-fire-production-apk
          path: |
            little-sprouts-fire-hd8-release.apk
            fire-apk-verification.json
          if-no-files-found: error
