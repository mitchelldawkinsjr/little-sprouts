name: Publish Fire Tablet Update
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify release configuration
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE: ${{ secrets.FIRE_APK_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.FIRE_APK_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.FIRE_APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FIRE_APK_KEY_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: |
          test -n "$KEYSTORE" && test -n "$PASSWORD" && test -n "$ALIAS" && test -n "$KEY_PASSWORD"
          [[ "$VERSION" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+$ ]]
          if gh release view "$VERSION" >/dev/null 2>&1; then echo "Release already exists"; exit 1; fi
      - name: Stage app
        run: python3 tools/fire-tablet/stage.py
      - name: Install Capacitor
        working-directory: .fire-build
        run: |
          printf '%s\n' '{"name":"little-sprouts-fire-build","version":"1.0.0","private":true}' > package.json
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android
      - name: Install updater and set version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 tools/fire-tablet/install-updater.py
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          path=Path('.fire-build/android/app/build.gradle')
          text=path.read_text()
          version=os.environ['VERSION']
          code=sum(int(n)*m for n,m in zip(version.split('.'),(1000000,1000,1)))+1
          text=re.sub(r'versionName\s+"[^"]+"', f'versionName "{version}"', text, count=1)
          text=re.sub(r'versionCode\s+\d+', f'versionCode {code}', text, count=1)
          path.write_text(text)
          PY
      - name: Match launcher icon to PWA
        run: |
          python3 -m pip install --user Pillow
          python3 tools/fire-tablet/install-icon.py
      - name: Build release APK
        working-directory: .fire-build/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign and verify APK
        env:
          KEYSTORE: ${{ secrets.FIRE_APK_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.FIRE_APK_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.FIRE_APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FIRE_APK_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/fire-release.jks"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/zipalign" -f -p 4 .fire-build/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/fire-release.jks" --ks-key-alias "$ALIAS" --ks-pass env:PASSWORD --key-pass env:KEY_PASSWORD --out little-sprouts-fire-hd8-release.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify --verbose little-sprouts-fire-hd8-release.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" little-sprouts-fire-hd8-release.apk --target "$GITHUB_SHA" --title "Little Sprouts Fire $VERSION" --notes "Signed Fire tablet APK update. Install approval is required on the device."
