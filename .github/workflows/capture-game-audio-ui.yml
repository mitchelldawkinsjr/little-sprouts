name: Capture Game Audio UI smoke tests

on:
  push:
    branches: [feat/game-audio-gpt6]
    paths:
      - .github/workflows/capture-game-audio-ui.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser controller
        run: npm install --prefix /tmp/sprouts-capture --no-audit --no-fund playwright-core@1.57.0
      - name: Start Little Sprouts locally
        run: |
          node server/serve.mjs > /tmp/little-sprouts-audio-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/little-sprouts-audio-server.log
          exit 1
      - name: Verify audio controls and capture real tablet screenshots
        run: node tools/capture-game-audio-ui.mjs
      - name: Commit verified screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/game-audio-toolbar-tablet.png docs/screenshots/game-audio-portrait-tablet.png docs/screenshots/game-audio-parent-settings.png
          git commit -m "Document gameplay sound and Parent Corner controls on tablets"
          git push origin HEAD:feat/game-audio-gpt6
