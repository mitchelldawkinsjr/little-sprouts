name: Fire Tablet APK
on:
  workflow_dispatch:
  push:
    branches: [feat/fire-tablet-apk]
    paths:
      - '.github/workflows/fire-tablet-apk.yml'
      - 'tools/fire-tablet/**'
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'sidecars/**'
      - 'games/**'
      - 'lib/**'
      - 'vendor/**'
      - 'app/**'
      - 'logic/**'
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Stage offline web assets
        run: python3 tools/fire-tablet/stage.py
      - name: Install Capacitor tooling
        working-directory: .fire-build
        run: |
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - name: Generate Android project
        working-directory: .fire-build
        run: |
          npx cap add android
          npx cap sync android
      - name: Build sideloadable debug APK
        working-directory: .fire-build/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-sprouts-fire-hd8-debug-apk
          path: .fire-build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
