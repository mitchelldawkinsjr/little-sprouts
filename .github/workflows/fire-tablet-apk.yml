name: Fire Tablet APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fire-tablet-apk.yml'
      - 'tools/fire-tablet/**'
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'sidecars/**'
      - 'games/**'
      - 'lib/**'
      - 'vendor/**'
      - 'app/**'
      - 'logic/**'
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Stage offline web assets
        run: python3 tools/fire-tablet/stage.py
      - name: Test updater policy and release versioning
        run: |
          javac -d "$RUNNER_TEMP/updater-tests" tools/fire-tablet/UpdatePolicy.java tools/fire-tablet/UpdatePolicyTest.java
          java -cp "$RUNNER_TEMP/updater-tests" org.littlesprouts.learning.UpdatePolicyTest
          python3 -m unittest discover -s tools/fire-tablet -p 'test_*.py'
      - name: Install Capacitor tooling
        working-directory: .fire-build
        run: |
          cp ../tools/fire-tablet/package.json ../tools/fire-tablet/package-lock.json .
          npm ci --no-audit --no-fund
      - name: Generate Android project
        working-directory: .fire-build
        run: |
          npx --no-install cap add android
          npx --no-install cap sync android
      - name: Add native Wi-Fi updater
        run: python3 tools/fire-tablet/install-updater.py
      - name: Match launcher icon to PWA
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 tools/fire-tablet/install-icon.py
      - name: Compile debug and release APKs
        working-directory: .fire-build/android
        run: ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Verify and stage signed APK
        run: |
          apk=.fire-build/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          cp "$apk" little-sprouts-fire-hd8.apk
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-sprouts-fire-hd8-debug-apk
          path: little-sprouts-fire-hd8.apk
          if-no-files-found: error
          retention-days: 30
