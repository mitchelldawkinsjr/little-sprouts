name: Fire Tablet APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fire-tablet-apk.yml'
      - 'tools/fire-tablet/**'
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'sidecars/**'
      - 'games/**'
      - 'lib/**'
      - 'vendor/**'
      - 'app/**'
      - 'logic/**'
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Stage offline web assets
        run: python3 tools/fire-tablet/stage.py
      - name: Install Capacitor tooling
        working-directory: .fire-build
        run: |
          printf '%s\n' '{"name":"little-sprouts-fire-build","version":"1.0.0","private":true}' > package.json
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - name: Generate Android project
        working-directory: .fire-build
        run: |
          npx cap add android
          npx cap sync android
      - name: Add native Wi-Fi updater
        run: python3 tools/fire-tablet/install-updater.py
      - name: Match launcher icon to PWA
        run: |
          python3 -m pip install --user Pillow
          python3 tools/fire-tablet/install-icon.py
      - name: Build sideloadable debug APK
        working-directory: .fire-build/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify and stage signed APK
        run: |
          apk=.fire-build/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          cp "$apk" little-sprouts-fire-hd8.apk
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-sprouts-fire-hd8-debug-apk
          path: little-sprouts-fire-hd8.apk
          if-no-files-found: error
          retention-days: 30
