<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sky flight</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
    }
  }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #87b4d6; overflow: hidden; font-family: Outfit, "Trebuchet MS", sans-serif; }
    #view { position: fixed; inset: 0; }
    #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: fixed; left: 12px; right: 12px; top: 10px; z-index: 2; margin: 0; text-align: center; color: #16382c; pointer-events: none; }
    #hud .spell-type { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 8px auto 0; width: min(240px, 80%); font-size: 14px; font-weight: 700; color: #f7f4ec; text-shadow: 0 1px 2px #16382c; }
    #hud .spell-type[hidden] { display: none; }
    #hud .spell-key { width: 100%; height: 46px; border: 0; border-radius: 12px; text-align: center; font: 700 26px Outfit, sans-serif; color: #16382c; background: #faf9f5ee; }
    #hud .spell-key.wrong { background: #fff4e9; }
    #hud .prompt { margin: 0 auto; max-width: 720px; padding: 8px 14px; border-radius: 14px; background: #faf9f5ee; font-size: clamp(18px, 3vw, 28px); font-weight: 700; line-height: 1.25; }
    #hud .show { display: flex; justify-content: center; margin-top: 8px; }
    #hud .show:empty { display: none; }
    #hud .countrow, #hud .numpath { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
    #hud .countrow span, #hud .numpath span { min-width: 28px; padding: 2px 4px; border-radius: 8px; background: #fff; font-size: 26px; }
    #hud .numpath .here { outline: 3px solid #db8b32; }
    #hud .slots { margin: 8px 0 0; letter-spacing: .18em; font-weight: 800; font-size: 28px; color: #f7f4ec; text-shadow: 0 1px 2px #16382c; }
    #hud .note { margin: 6px 0 0; font-weight: 700; color: #f3d7a1; text-shadow: 0 1px 2px #16382c; }
    .steer, .flypad { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 2; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; pointer-events: none; }
    .steer[hidden], .flypad[hidden] { display: none; }
    .steer .stack, .flypad .stack { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
    .flypad .row { display: flex; gap: 10px; pointer-events: none; }
    .flypad .cap { pointer-events: none; color: #faf9f5; font-weight: 800; font-size: 15px; text-shadow: 0 1px 2px #16382c; }
    .steer button, .flypad button { pointer-events: auto; touch-action: none; width: 76px; height: 76px; border: 0; border-radius: 22px; background: #16382ce6; color: #faf9f5; font-size: 32px; }
    .steer button:active, .flypad button:active { background: #2f6a52; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="hud" aria-live="polite">
    <p class="prompt" id="prompt">Hold the buttons. Steer through a gate.</p>
    <div class="show" id="show"></div>
    <p class="slots" id="slots" hidden></p>
    <label class="spell-type" id="spellType" hidden>Type the next letter
      <input class="spell-key" id="spellInput" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="text" aria-label="Type the next letter">
    </label>
    <p class="note" id="note" hidden></p>
  </div>
  <div class="steer" id="quizSteer">
    <button type="button" id="left" aria-label="Turn left">◀</button>
    <button type="button" id="right" aria-label="Turn right">▶</button>
  </div>
  <div class="flypad" id="flypad" hidden>
    <div class="stack">
      <span class="cap">Look</span>
      <button type="button" id="noseUp" aria-label="Nose up">▲</button>
      <div class="row">
        <button type="button" id="turnLeft" aria-label="Turn left">◀</button>
        <button type="button" id="turnRight" aria-label="Turn right">▶</button>
      </div>
      <button type="button" id="noseDown" aria-label="Nose down">▼</button>
    </div>
    <div class="stack">
      <span class="cap">Fly</span>
      <button type="button" id="forward" aria-label="Fly forward">▲</button>
      <div class="row">
        <button type="button" id="slideLeft" aria-label="Slide left">◀</button>
        <button type="button" id="slideRight" aria-label="Slide right">▶</button>
      </div>
      <button type="button" id="back" aria-label="Fly back">▼</button>
    </div>
  </div>
  <script type="module" src="flight.js?v=ask-first"></script>
</body>
</html>
