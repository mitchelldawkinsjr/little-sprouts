<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sketchbook Trail · Little Sprouts</title>
  <link rel="stylesheet" href="./trail.css?v=trail3">
</head>
<body data-trail-paused>
  <header id="trail-hud">
    <strong>Sketchbook Trail</strong>
    <p id="trail-mode">Opening the playground…</p>
    <button type="button" id="trail-menu" aria-controls="trail-panel" aria-expanded="false" hidden>Menu</button>
  </header>
  <div id="trail-guide" aria-label="Direction and distance to next beacon" hidden>
    <span id="trail-arrow" aria-hidden="true">↑</span>
    <span id="trail-distance"></span>
  </div>
  <p id="trail-notice" role="status" aria-live="polite" hidden></p>
  <section id="trail-panel" role="dialog" aria-modal="true" aria-labelledby="trail-panel-title" hidden data-pad-menu data-touch-ignore>
    <h2 id="trail-panel-title">Trail menu</h2>
    <div id="trail-actions">
      <button type="button" id="trail-resume" data-trail-back>Keep playing</button>
      <button type="button" id="trail-starts" hidden>Starting places</button>
      <button type="button" id="trail-return" hidden>Back to the trail</button>
      <button type="button" id="trail-finish" hidden>Finish trail</button>
    </div>
  </section>
  <section id="trail-picker" role="dialog" aria-modal="true" aria-labelledby="trail-picker-title" hidden data-pad-menu data-touch-ignore>
    <h2 id="trail-picker-title">Where should we start?</h2>
    <div id="trail-scenarios"></div>
    <button type="button" id="trail-close" data-trail-back>Cancel</button>
  </section>
  <div id="trail-touch" role="group" aria-label="Touch controls" hidden data-touch-ignore>
    <button type="button" data-control="KeyQ" hidden>Yaw left</button>
    <button type="button" data-control="KeyE" hidden>Yaw right</button>
    <button type="button" data-control="KeyV" hidden>View</button>
    <button type="button" data-control="KeyX" hidden>Switch seat</button>
    <button type="button" data-control="KeyB" hidden>Wheel brake</button>
    <button type="button" data-control="KeyG" hidden>Passenger</button>
    <button type="button" data-control="KeyF">Vehicle</button>
    <button type="button" data-control="ShiftLeft">Run</button>
    <button type="button" data-control="Space">Jump</button>
  </div>
  <p id="trail-help" hidden></p>
  <script src="./build/sketchbook.min.js?v=trail1"></script>
  <script type="module" src="./trail.mjs?v=trail3"></script>
</body>
</html>
