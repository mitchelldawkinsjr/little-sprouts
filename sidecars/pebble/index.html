<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="/lib/game-touch.css?v=1">
<title>Pebble roll</title>
<style>
:root { color-scheme: light; font: 16px/1.35 system-ui,sans-serif; color: #181d16; background: #fffafa }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; overflow: hidden }
#world, #world canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block }
#world canvas { touch-action: none }
.hud, .controls { position: fixed; left: max(12px,env(safe-area-inset-left)); right: max(12px,env(safe-area-inset-right)); display: flex; align-items: center; justify-content: space-between; gap: 8px; pointer-events: none }
.hud { top: max(10px,env(safe-area-inset-top)); align-items: flex-start }
.hud-copy { display: grid; justify-items: start; gap: 5px; font-family: Georgia, serif }
#directions { padding: 0 3px; color: #151515; background: #ffed58 }
#score { font-size: 1.15rem }
#world:focus { outline: none }
@media (any-pointer: fine) and (not (any-pointer: coarse)) {
  .controls:not(:focus-within) { opacity: .35 }
}
.controls { bottom: max(10px,env(safe-area-inset-bottom)) }
.controls div { display: flex; gap: 6px }
.pill, button { border: 1px solid #c8dbcd; border-radius: 99px; padding: 7px 12px; background: #f9fff2; box-shadow: 0 2px 0 #163d342c }
button { min-height: 44px; min-width: 46px; pointer-events: auto; font: inherit; color: inherit; cursor: pointer; touch-action: manipulation }
button:focus-visible { outline: 3px solid #9b4706; outline-offset: 3px }
.overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 12px; background: #fffafa26 }
.card { width: min(340px,100%); max-height: 100%; overflow: auto; text-align: center; padding: clamp(14px,4vw,28px); border: 1px solid #d3d9ca; border-radius: 13px; background: #fffafaf5; box-shadow: 0 3px 15px #28382920 }
#countdown { pointer-events: none; background: #fffafa26 }
.countdown-card { display: grid; justify-items: center; gap: 2px; border-radius: 15px; padding: 11px 24px 14px; background: #fffafaf5; box-shadow: 0 3px 15px #28382932; text-align: center }
#countdownDigit { color: #275e47; font-size: clamp(2.5rem, 12vmin, 5rem); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums }
.card h1 { margin: 0; font-size: clamp(1.5rem,5vw,2.5rem) }
.card p { margin: 8px 0 14px }
.card button:first-of-type { background: #275e47; color: white }
#notice { position: fixed; bottom: max(65px,18%); width: 100%; text-align: center; pointer-events: none }
#notice span { display: inline-block }
#sprouts-quiz .choice:focus-visible, #sprouts-quiz .soft:focus-visible { outline: 3px solid #9b4706 }
@media (max-width:400px) {
  .hud { font-size: .86rem; gap: 4px }
  .pill, button { padding-inline: 8px }
}
</style>
</head>
<body data-game-touch-canvas>
  <div id="world" tabindex="-1" role="group" aria-label="Forest course"></div>
  <div class="hud" id="hud" hidden>
    <div class="hud-copy">
      <span id="directions">Up to jump · Left / Right to move</span>
      <output id="score" aria-label="Score" aria-live="off">0</output>
      <span id="hearts" aria-live="polite" hidden>3 hearts</span>
      <span id="shield" hidden>🛡 Shield ready</span>
    </div>
    <button type="button" id="pause" data-game-touch>Pause</button>
  </div>
  <p id="notice" hidden role="status"><span class="pill"></span></p>
  <div class="controls" id="controls" data-game-touch hidden>
    <div><button type="button" id="left" aria-label="Move left">◀</button><button type="button" id="right" aria-label="Move right">▶</button></div>
    <button type="button" id="jump">Jump ↑</button>
  </div>
  <div class="overlay" id="countdown" hidden>
    <div class="countdown-card">
      <strong role="status">Shield charged. Get ready!</strong>
      <span id="countdownDigit" aria-hidden="true">2</span>
    </div>
  </div>
  <section class="overlay" id="menu" data-pad-menu aria-label="Pebble roll menu">
    <div class="card">
      <h1 id="title">Pebble roll</h1>
      <p id="hint">Switch lanes or jump to dodge the trees.</p>
      <button type="button" id="play" hidden>Roll!</button>
      <button type="button" id="leave" hidden>All games</button>
    </div>
  </section>
  <script type="module" src="./game.mjs?v=4-sfx1"></script>
</body>
</html>
