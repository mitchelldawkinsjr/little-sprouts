map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Fixed, low-cardinality request timings. Never log query strings, IPs, referrers, or agents here.
log_format sprouts_ops escape=json '{"event":"http_request","surface":"$sprouts_surface","status":$status,"seconds":$request_time,"bytes":$body_bytes_sent,"gzip_ratio":"$gzip_ratio"}';
map $uri $sprouts_surface {
    default "";
    / app;
    /index.html app;
    /app.js app_javascript;
    /style.css app_styles;
    /sw.js service_worker;
    /for-parents/ parent_landing;
    /for-parents/index.html parent_landing;
    /ops/diagnostics diagnostics;
    /offline-files.json offline_manifest;
    /sidecars.json sidecar_catalog;
    /healthz health;
    /link friend_link;
}
map $sprouts_surface $sprouts_log {
    default 1;
    "" 0;
    health 0;
}
limit_req_zone $server_name zone=diagnostic_ingest:1m rate=10r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout sprouts_ops if=$sprouts_log;
    gzip_static on;
    gzip_vary on;
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    # Fall back to dynamic gzip when a matching precompressed asset is not available.
    gzip_types text/css application/javascript text/plain image/svg+xml application/json application/wasm model/gltf+json text/csv application/manifest+json;

    # Lets the voice model use more than one CPU thread. credentialless keeps font and CDN loads working.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;

    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
    }

    location ~* \.gltf$ {
        default_type model/gltf+json;
        try_files $uri =404;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
    }

    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
    }

    location ~* \.csv$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
    }

    location /voice/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
        types { audio/mp4 m4a; }
    }

    location ~* \.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
    }

    location = /healthz {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $ops_upstream link:5180;
        proxy_pass http://$ops_upstream;
        proxy_read_timeout 2s;
    }

    # Prometheus scrapes the private link service, not the public virtual host.
    location = /metrics { return 404; }

    location = /ops/diagnostics {
        limit_req zone=diagnostic_ingest burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 2k;
        client_body_timeout 5s;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $ops_upstream link:5180;
        proxy_pass http://$ops_upstream;
        proxy_read_timeout 5s;
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_set_header User-Agent "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
    }

    location = /for-parents/analytics.json {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $ops_upstream link:5180;
        proxy_pass http://$ops_upstream;
        proxy_read_timeout 2s;
    }

    location /for-parents/ {
        try_files $uri $uri/ =404;
        # This isolated informational page can load the consented Google tag.
        add_header Referrer-Policy "no-referrer" always;
    }

    location ~ ^/(offline-files|sidecars)\.json$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
    }

    location /sidecars/ {
        try_files $uri $uri/ =404;
    }

    # Paint Sphere "Play with a friend" pairs two browsers here.
    location /link {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $paint_link link:5180;
        proxy_pass http://$paint_link;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ~ \.gz$ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
    }
}
